<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pet</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; flex-direction: column;
        background: var(--oc-bg, transparent); color: var(--oc-fg, inherit);
        font-family: var(--oc-font, inherit); font-size: 0.875rem;
        overflow: hidden;
      }
      #stage { position: relative; flex: 1 1 auto; min-height: 120px; }
      #pet { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #status {
        flex: 0 0 auto; padding: 7px 12px; min-height: 1.4em;
        font-size: 0.78rem; color: var(--oc-muted, inherit);
        border-top: 1px solid var(--oc-border, transparent);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #settings {
        flex: 0 0 auto; display: flex; flex-direction: column; gap: 10px;
        padding: 10px 12px 12px; border-top: 1px solid var(--oc-border, transparent);
        max-height: 46%; overflow-y: auto;
      }
      #settings[hidden] { display: none; }
      #empty { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 16px; }
      #empty[hidden] { display: none; }
      #banner-slot { flex: 0 0 auto; padding: 8px 12px 0; }
      #banner-slot:empty { display: none; }
      #banner-slot[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="pet"></canvas></div>
    <div id="banner-slot" hidden></div>
    <div id="status">waking up…</div>
    <div id="settings" hidden></div>
    <div id="empty" hidden></div>
    <script src="main.js"></script>
  </body>
</html>
